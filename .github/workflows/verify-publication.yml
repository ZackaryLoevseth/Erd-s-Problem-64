name: Verify Erdős #64 publication packet

on:
  push:
    branches:
      - main
      - "publication/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public packet hashes
        run: python verify_manifest.py
